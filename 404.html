<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abschnitt-Wasser ist umgezogen</title>

<!-- GitHub Pages liefert diese Datei für jeden Pfad aus, den es nicht kennt.
     Nach dem Entfernen der alten App betrifft das auch agb.html,
     impressum.html und datenschutz.html — und genau die sind verlinkt und
     in Lesezeichen. Das Skript übernimmt deshalb den Pfad und leitet auf die
     gleichnamige Seite der neuen Domain weiter.

     Die refresh-Angabe steht bewusst auf 3 Sekunden statt 0: Sie ist nur der
     Notnagel ohne JavaScript. Stünde sie auf 0, könnte sie das Skript
     überholen und jeden Tiefenlink auf die Startseite werfen. -->
<link rel="canonical" href="https://abschnitt-wasser.de/">
<meta http-equiv="refresh" content="3; url=https://abschnitt-wasser.de/">
<script>
(function () {
  var ziel = "https://abschnitt-wasser.de/";
  try {
    // Alles hinter dem Projektordner übernehmen, z. B. "impressum.html"
    var rest = location.pathname.replace(/^\/Berechnung\/?/, "");
    // Nur einfache Dateinamen durchlassen — keine Pfadwechsel, keine Hosts
    if (/^[A-Za-z0-9._-]{1,60}$/.test(rest) && rest.indexOf("..") === -1) {
      ziel += rest;
    }
  } catch (e) { /* Pfad unlesbar: Startseite genügt */ }
  location.replace(ziel);
})();
</script>

<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f1f4f7; color: #191e26;
    font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  .kasten {
    max-width: 30rem; background: #fff; border: 1px solid #dce2e9;
    border-radius: 6px; padding: 28px 32px; text-align: center;
  }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p  { margin: 0 0 16px; color: #3d4652; }
  a.knopf {
    display: inline-block; background: #0e6a6e; color: #fff;
    text-decoration: none; font-weight: 600;
    padding: 12px 22px; border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="kasten">
    <h1>Abschnitt-Wasser ist umgezogen</h1>
    <p>Diese Adresse wird nicht mehr gepflegt. Du wirst gleich weitergeleitet.</p>
    <p><a class="knopf" href="https://abschnitt-wasser.de/">Weiter zu Abschnitt-Wasser</a></p>
  </div>
</body>
</html>
